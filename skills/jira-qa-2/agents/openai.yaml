interface:
  display_name: "Jira QA 阶段二（测试方案与 XMind）"
  short_description: "只执行 QA 阶段二：读取 Jira 最新材料与门禁结论，生成测试方案与测试点 XMind，上传 Jira 并写结果评论，等待人工复核，最后打包 zip 供下载"
  default_prompt: "用 $jira-qa-2 处理这个 Jira 需求单。只执行阶段二：prepare.mjs --stage 2，READY 时生成测试方案与 xmind.spec.json 并校验，design-spec 后上传方案与 XMind、写 QA-测试方案结果评论，最后传给人工复核；不执行阶段一和阶段三，不改 Jira 状态，交付包放到 outputs/ 顶层供下载。"
