interface:
  display_name: "Jira G1-Pre 上游需求准入检查"
  short_description: "按 F01~F07 七项事实检查 Jira 上游事项的原始诉求是否清楚、完整、无实质歧义；只输出通过/不通过，不通过时按固定分类列出补充要求并 @ 报告人；不流转状态、不改字段、不上传附件"
  default_prompt: "用 $jira-gate-1-pre 检查这个 Jira 事项的原始诉求是否达到 G1-Pre 准入标准。先确认问题类型属于「客户用户故事 / 故事 / 项目概算评估 / 任务 / 项目实施阶段」之一；客户用户故事或故事的目标状态为「评审中」时跳过；不符合就跳过。逐项判定 F01~F07，并套用对应类型的条件场景。只通过一条 G1-Pre 评论交付结论：通过时写结论与可选规范建议，不通过时按固定分类列出全部阻断项并用 Jira 用户 key @ 报告人。不要流转状态、修改字段、上传或删除附件，也不要调用其它技能；评论中不得出现规则版本、内容指纹、sha256 或「G1-Pre 指纹」。"
