interface:
  display_name: "Jira G1-Pre 上游需求准入检查"
  short_description: "按 facts / request / evidence 三项检查判断 Jira 上游需求是否足以向下流转；通过时生成需求评估摘要，不通过时按固定分类列出当前问题、依据与最小补充动作并 @ 报告人；不流转状态、不改字段、不上传附件"
  default_prompt: "用 $jira-gate-1-pre 检查这个 Jira 事项的原始诉求是否达到 G1-Pre 向下流转门禁（规则 V1.2）。先确认问题类型属于「客户用户故事 / 故事 / 项目概算评估 / 任务 / 项目实施阶段」之一；客户用户故事或故事的目标状态为「评审中」时跳过；不符合就跳过。先建材料来源图、识别 requirementKind 与 structureStatus/specCoverage，再逐项完成 facts、request、evidence 三项检查，并套用该需求类型的观察重点。只通过一条 G1-Pre 评论交付结论：通过时写「需求评估摘要」（背景 / 目标 / 要点 / 建议澄清方向）和免责声明，不通过时先列本次阻断项再逐项写当前问题、依据、最小补充动作，并用 Jira 用户 key @ 报告人。不要流转状态、修改字段、上传或删除附件，也不要调用其它技能；评论中不得出现规则版本、内容指纹、sha256 或「G1-Pre 指纹」。"
