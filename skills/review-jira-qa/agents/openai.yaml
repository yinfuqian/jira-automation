interface:
  display_name: "Jira QA 需求准入门禁（阶段一）"
  short_description: "只执行阶段一：读取 Jira 最新需求材料，按 B1-B7 / C1-C6 判定，覆盖全部 AC 并回应扫描候选，生成自包含 HTML、上传附件并写 QA 评论"
  default_prompt: "用 $review-jira-qa 对这个 Jira 需求单执行 QA 需求准入门禁（只执行阶段一）。先运行 prepare.mjs --stage 1：READY 时完整核读需求侧材料，运行 scan.mjs 生成 candidates.json，按 B1-B7 / C1-C6 写含 checks、coverage、scans 的 gate.spec.json，再 render-gate、validate-gate、上传 Jira 并写 QA 评论；REUSED 时直接复用上一版结论；SKIPPED 记为不适用；ERROR 记为未完成。不要进入阶段二/三，不要修改 Jira 状态；任何结果都必须把控制权交还调用方，不得阻塞 G1 或其它父流程。"
