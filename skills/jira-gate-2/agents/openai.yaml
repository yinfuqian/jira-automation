interface:
  display_name: "Jira G2 技术方案准出检查"
  short_description: "按《技术方案准出 Checklist》检查 Jira 故事单：评论里用绿勾/红叉逐项展示；通过不流转状态，不通过流转到「开发设计中」并 @ 流转人"
  default_prompt: "用 $jira-gate-2 检查这个 Jira 需求链接的技术方案是否达到 G2 准出标准。先确认单据类型是「故事」，不是就跳过；按《技术方案准出 Checklist》逐项判定，把结论和绿勾/红叉清单写进评论。通过时保持当前状态不流转；不通过就流转到「开发设计中」并在评论里 @ 流转人。"
