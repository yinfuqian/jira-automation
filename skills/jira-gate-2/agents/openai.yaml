interface:
  display_name: "Jira G2 技术方案准出检查"
  short_description: "按《技术方案准出 Checklist》与《通用团队交付物 PDCA 规范》双清单检查 Jira 故事单的技术方案，评论里用绿勾/红叉逐项展示并上传 RD 角色 PDCA 报告；通过不流转状态，任一不通过流转到「开发设计中」并 @ 流转人"
  default_prompt: "用 $jira-gate-2 检查这个 Jira 需求链接的技术方案是否达到 G2 准出标准。先确认单据类型是「故事」，不是就跳过；按《技术方案准出 Checklist》逐项判定 10 项 MUST 与命中的 CONDITIONAL，同时按《通用团队交付物 PDCA 规范》执行 RD 开发交付物检查（D-01~D-10），两套结论合并后把绿勾/红叉清单写进评论，并生成 <需求名称>_RD_<YYYYMMDD>_<NN>_PDCA.md 报告上传为附件。两套判定全部满足时保持当前状态不流转；任一不满足就流转到「开发设计中」并在评论里 @ 流转人。"
