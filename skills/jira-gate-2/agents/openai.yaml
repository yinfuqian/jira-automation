interface:
  display_name: "Jira G2 技术方案准出检查"
  short_description: "按《技术方案准出 Checklist》与《通用团队交付物 PDCA 规范》双清单检查 Jira 故事单的技术方案：G2 只判 6 项 MUST，仅明确阻断才退回；评论通过只留结论、退回只列失败项，并上传 RD 角色 PDCA 报告；通过不流转状态，任一不通过流转到「开发设计中」并 @ 流转人"
  default_prompt: "用 $jira-gate-2 检查这个 Jira 需求链接的技术方案是否达到 G2 准出标准。先确认单据类型是「故事」且产品归属属于 Bot/Call/See/Pal/Learn/Aiforce 之一，任一项不符就跳过；按《技术方案准出 Checklist》逐项判定 6 项 MUST（G2-M01~M06）与命中的 CONDITIONAL，只在存在明确阻断时退回，非核心缺失不阻断；同时按《通用团队交付物 PDCA 规范》（V2.3.0 / template V1.1）执行 RD 开发交付物检查（D-01~D-10）；PDCA 结论只有「通过」/「不通过」，PRD 缺失、不可读或取证中断时记「执行异常」，不得写成通过或不通过。评论遵循精简口径：通过只写结论、OpenSpec 权限、技术方案与 PRD 定位，退回补充只列不通过项，不输出通过项与 N/A，并写 PDCA 三行；生成 <需求名称>_RD_<YYYYMMDD>_<NN>_PDCA.md 报告上传为附件。两套判定全部满足时保持当前状态不流转；任一不满足就流转到「开发设计中」并在评论里 @ 流转人。"
